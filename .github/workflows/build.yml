
name: Build PyxisAddon

on:
  workflow_dispatch:
  push:
    paths:
      - "PyxisAddon-GitHub-Build.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Extract project
        run: |
          mkdir project
          unzip -q PyxisAddon-GitHub-Build.zip -d project

      - name: Build addon
        run: gradle -p project build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PyxisAddon-JAR
          path: project/build/libs/*.jar
          if-no-files-found: error
          
